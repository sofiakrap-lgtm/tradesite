<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo-mock</title>
<!-- Placeholder-demosivu kuvakaappauksia varten. Ei julkaista. Parametrit: ?ind=saneeraus&view=home -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Figtree:wght@300..800&family=Barlow+Condensed:wght@500;700;800&family=Manrope:wght@400..800&family=DM+Serif+Display&family=Oswald:wght@400..700&family=Inter:wght@400..800&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{--bg:#f4f1ec;--ink:#1d1d1b;--muted:#5d5a54;--accent:#2f4a3a;--accent-ink:#fff;--soft:#e7e2d9;--card:#fff;--hfont:"Archivo";--hstretch:110%;--bfont:"Figtree";--radius:14px;--photo1:#8a8f7a;--photo2:#c9c2b1;--photo3:#4e5547}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--bfont),sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding:0 40px}
.nav{display:flex;align-items:center;justify-content:space-between;height:76px}
.brand{display:flex;align-items:center;gap:10px;font:800 21px/1 var(--hfont),sans-serif;font-stretch:var(--hstretch);letter-spacing:-.2px;text-transform:uppercase}
.brand i{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-style:normal;font-size:15px}
.brand small{display:block;font:500 11px/1 var(--bfont);letter-spacing:.12em;color:var(--muted);margin-top:3px}
.links{display:flex;gap:30px;font-weight:600;font-size:15px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 22px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;text-decoration:none;white-space:nowrap}
.btn--ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn svg{width:18px;height:18px}
.hero{position:relative;margin:0 24px;border-radius:28px;overflow:hidden;min-height:560px;display:flex;align-items:flex-end;color:#fff}
.photo{position:absolute;inset:0;background:
  radial-gradient(120% 80% at 80% 10%,rgba(255,255,255,.35),transparent 60%),
  linear-gradient(160deg,var(--photo2) 0%,var(--photo1) 45%,var(--photo3) 100%)}
.photo svg{position:absolute;right:0;bottom:0;width:78%;height:auto;opacity:.9}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55),rgba(0,0,0,.05) 60%)}
.hero__in{position:relative;z-index:1;padding:56px;max-width:760px;display:flex;flex-direction:column;gap:20px}
.kicker{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.18);font-weight:600;font-size:14px}
.h1{font:800 64px/1 var(--hfont),sans-serif;font-stretch:var(--hstretch);letter-spacing:-.5px;text-transform:var(--htransform,none)}
.hero p.lead{font-size:20px;opacity:.92;max-width:560px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.hero .btn--ghost{color:#fff;box-shadow:inset 0 0 0 2px #fff}
.trust{display:flex;gap:28px;padding-block:28px;color:var(--muted);font-weight:600;font-size:15px;flex-wrap:wrap}
.trust span{display:flex;align-items:center;gap:8px}
.trust svg{width:20px;height:20px;color:var(--accent)}
section.blk{padding:72px 0}
.h2{font:800 40px/1.05 var(--hfont),sans-serif;font-stretch:var(--hstretch);letter-spacing:-.3px;text-transform:var(--htransform,none)}
.sub{color:var(--muted);font-size:18px;margin-top:12px;max-width:620px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:36px}
.card{background:var(--card);border-radius:var(--radius);padding:26px;display:flex;flex-direction:column;gap:12px}
.card .ic{width:48px;height:48px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--accent)}
.card .ic svg{width:26px;height:26px}
.card h3{font:700 21px/1.2 var(--hfont),sans-serif;font-stretch:var(--hstretch)}
.card p{color:var(--muted);font-size:15px}
.ph-img{border-radius:var(--radius);background:linear-gradient(150deg,var(--photo2),var(--photo1) 55%,var(--photo3));position:relative;overflow:hidden}
.ph-img svg{position:absolute;inset:auto 0 0 auto;width:90%;opacity:.8}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:36px}
.ba{position:relative;aspect-ratio:4/3;border-radius:var(--radius);overflow:hidden}
.ba .l,.ba .r{position:absolute;inset:0}
.ba .l{background:linear-gradient(160deg,#9b958a,#6f6a62);filter:saturate(.3)}
.ba .r{clip-path:inset(0 0 0 50%);background:linear-gradient(160deg,var(--photo2),var(--photo1) 55%,var(--photo3))}
.ba .r svg,.ba .l svg{position:absolute;bottom:0;right:0;width:100%}
.ba .line{position:absolute;left:50%;top:0;bottom:0;width:3px;background:#fff;margin-left:-1.5px}
.ba .knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:999px;background:#fff;color:var(--ink);display:grid;place-items:center;font-weight:800}
.ba .tag{position:absolute;top:14px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.ba .tag.b{left:14px;background:#1d1d1b;color:#fff}.ba .tag.a{right:14px;background:#fff;color:#1d1d1b}
.ba-cap{margin-top:10px;font-weight:600;font-size:15px;color:var(--muted)}
.reviews{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:36px}
.rev{background:var(--card);border-radius:var(--radius);padding:26px;display:flex;flex-direction:column;gap:14px}
.stars{display:flex;gap:4px;color:var(--accent)}
.stars svg{width:18px;height:18px;fill:currentColor}
.rev p{font-size:16px}
.rev .who{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;font-weight:600}
.rev .who i{width:34px;height:34px;border-radius:10px;background:var(--soft)}
.lines{display:flex;flex-direction:column;gap:8px}
.lines b{display:block;height:10px;border-radius:6px;background:var(--soft)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.ded{background:var(--accent);color:var(--accent-ink);border-radius:24px;padding:44px;display:grid;grid-template-columns:1.2fr 1fr;gap:36px;align-items:center}
.ded .h2{color:var(--accent-ink)}
.ded .big{font:800 72px/1 var(--hfont);font-stretch:var(--hstretch)}
.ded ul{list-style:none;padding:0;margin:18px 0 0;display:flex;flex-direction:column;gap:10px}
.ded li{display:flex;gap:10px;align-items:center}
.ded li svg{width:20px;height:20px}
.calc{background:rgba(255,255,255,.12);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:14px}
.calc .r{display:flex;justify-content:space-between;font-weight:600}
.calc .bar{height:8px;border-radius:9px;background:rgba(255,255,255,.25);position:relative}
.calc .bar::after{content:"";position:absolute;inset:0 40% 0 0;border-radius:9px;background:var(--accent-ink)}
.form{background:var(--card);border-radius:24px;padding:36px;display:flex;flex-direction:column;gap:14px}
.in{height:56px;border-radius:12px;background:var(--bg);display:flex;align-items:center;padding:0 16px;color:var(--muted);font-size:15px;gap:10px}
.in svg{width:20px;height:20px}
.in.ta{height:110px;align-items:flex-start;padding-top:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.contact-list{display:flex;flex-direction:column;gap:18px;margin-top:28px}
.contact-list div{display:flex;gap:14px;align-items:center;font-weight:600}
.contact-list i{width:46px;height:46px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--accent)}
.contact-list svg{width:22px;height:22px}
.map{position:relative;border-radius:24px;overflow:hidden;background:#dfe3dc;aspect-ratio:16/10}
.map svg.m{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;width:40px;height:40px;margin:-40px 0 0 -20px;color:var(--accent)}
.pin svg{width:40px;height:40px;fill:currentColor;stroke:#fff;stroke-width:1.5}
.area{position:absolute;left:12%;top:18%;width:52%;height:58%;border-radius:50%;background:color-mix(in srgb,var(--accent) 14%,transparent);box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--accent) 60%,transparent)}
.maplegend{position:absolute;left:20px;bottom:20px;background:#fff;border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:15px;max-width:300px}
.maplegend small{color:var(--muted);font-weight:400}
footer{background:var(--ink);color:#d8d4cc;padding:56px 0;margin-top:40px}
footer .cols{display:grid;grid-template-columns:2fr 1fr 1fr;gap:30px}
footer .brand small{color:#a7a29a}
.callbar{display:none}
/* ---------- puhelin ---------- */
@media (max-width:600px){
  body{font-size:16px}
  .wrap{padding:0 20px}
  .nav{height:64px}
  .links,.nav .btn{display:none}
  .burger{display:grid!important}
  .hero{margin:0 12px;min-height:540px;border-radius:22px}
  .hero__in{padding:28px 22px;gap:16px}
  .h1{font-size:34px;overflow-wrap:anywhere}
  .hero .row{flex-wrap:nowrap}.hero .row .btn{padding:0 14px;font-size:15px}
  .hero p.lead{font-size:17px}
  .hero .row .btn{flex:1;justify-content:center}
  .trust{gap:12px 18px;padding-block:20px;font-size:14px}
  section.blk{padding:48px 0}
  .h2{font-size:30px}
  .cards,.reviews,.gallery,.split,.two{grid-template-columns:1fr}
  .cards{gap:14px}
  .ded{grid-template-columns:1fr;padding:28px;gap:24px}
  .ded .big{font-size:54px}
  .form{padding:22px}
  footer .cols{grid-template-columns:1fr}
  .callbar{display:grid;position:fixed;left:12px;right:12px;bottom:14px;grid-template-columns:1fr 1fr;gap:8px;z-index:9;padding:8px;border-radius:999px;background:var(--card);box-shadow:0 0 0 1px rgba(0,0,0,.06)}
  .callbar .btn{justify-content:center;height:50px}
  .callbar .btn--ghost{box-shadow:inset 0 0 0 2px var(--soft)}
  body.focus-call .callbar{outline:4px solid var(--accent);outline-offset:4px}
}
.burger{display:none;width:44px;height:44px;border-radius:12px;background:var(--soft);place-items:center}
.burger svg{width:22px;height:22px}

body.old{background:#dcdcdc;font:13px/1.4 "Times New Roman",serif;color:#000}
.oldwrap{width:980px;margin:0 auto;background:#fff;min-height:100vh;border-left:1px solid #999;border-right:1px solid #999}

<body>

<script>
const P = new URLSearchParams(location.search);
const ind = P.get('ind') || 'saneeraus';
const label = P.get('label');
const D = {

const svg = (n, extra = '') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" ${extra}>${I[n] || ''}</svg>`;

const mob = innerWidth < 600;
const img = n => PH ? `<img src="${PH}${n}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%">` : '';
const sc = PH ? '' : (scene[ind] || scene.saneeraus);
const name = `${d.brand}<small>YRITYKSESI OY</small>`;

<section class="blk" id="reviews"><div class="wrap"><h2 class="h2">Asiakasarviot</h2><p class="sub">Mitä asiakkaat sanovat.</p><div class="reviews">${[1, 2, 3].map(() => `<div class="rev"><div class="stars">${svg('star').repeat(5)}</div><p>Asiakkaan oma arvio tulee tähän. Placeholder-teksti.</p><div class="lines"><b style="width:90%"></b><b style="width:70%"></b></div><div class="who"><i></i>Asiakas, paikkakunta</div></div>`).join('')}</div></div></section>
<section class="blk" id="deduction"><div class="wrap"><div class="ded"><div><p style="font-weight:700;opacity:.8">Kotitalousvähennys</p><h2 class="h2" style="margin-top:8px">Osa työn hinnasta takaisin</h2><ul><li>${svg('check')}Koskee työn osuutta</li><li>${svg('check')}Erittelemme työn laskulle</li><li>${svg('check')}Autamme hakemisessa</li></ul></div><div class="calc"><div class="r"><span>Työn osuus</span><span>[summa] €</span></div><div class="bar"></div><div class="r"><span>Vähennys</span><span>[summa] €</span></div><p style="font-size:13px;opacity:.75">Esimerkki. Tarkat ehdot: vero.fi</p></div></div></div></section>
<section class="blk" id="map"><div class="wrap"><h2 class="h2">Palvelualue</h2><p class="sub">Toimimme kotipaikkakunnalla ja lähikunnissa.</p><div class="map" style="margin-top:32px"><svg class="m" viewBox="0 0 1000 625" preserveAspectRatio="xMidYMid slice"><rect width="1000" height="625" fill="#e6e9e2"/><path d="M0 420C180 380 260 470 420 430s260-150 420-120 160 40 160 40v295H0z" fill="#d4dccf"/><path d="M640 0c-20 120 60 160 40 260s-120 120-100 365" stroke="#c4d3d8" stroke-width="40" fill="none"/><g stroke="#fff" stroke-width="10" fill="none"><path d="M0 200h1000M300 0v625M0 520l1000-260"/></g><g stroke="#fff" stroke-width="4" fill="none" opacity=".8"><path d="M0 120h1000M0 330h1000M120 0v625M520 0v625M820 0v625"/></g></svg><span class="area"></span>${[[30, 40], [44, 55], [36, 62], [52, 38]].map(([x, y]) => `<span class="pin" style="left:${x}%;top:${y}%">${svg('pin')}</span>`).join('')}<div class="maplegend">${svg('pin', 'width="20" height="20" style="color:var(--accent)"')}Palvelualue<small>Kotikunta ja lähialueet</small></div></div></div></section>
<section class="blk" id="contact" style="background:var(--card)"><div class="wrap split"><div><h2 class="h2">Pyydä tarjous</h2><p class="sub">Kerro lyhyesti työstä. Vastaamme samana päivänä.</p><div class="contact-list"><div><i>${svg('phone')}</i>040 000 0000</div><div><i>${svg('mail')}</i>info@yrityksesi.fi</div><div><i>${svg('pin')}</i>Palvelualue: kotikunta ja lähialueet</div></div></div><div class="form" style="background:var(--bg)"><div class="two"><div class="in" style="background:var(--card)">${svg('user')}Nimi</div><div class="in" style="background:var(--card)">${svg('phone')}Puhelin</div></div><div class="in" style="background:var(--card)">${svg('mail')}Sähköposti</div><div class="in ta" style="background:var(--card)">Kerro työstä</div><a class="btn" style="justify-content:center">Lähetä tarjouspyyntö ${svg('arrow')}</a></div></div></section>
<footer><div class="wrap cols"><div class="brand" style="color:#fff"><i>${d.short}</i><span>${name}</span></div><div>Palvelut<br>Työt<br>Yhteystiedot</div><div>040 000 0000<br>info@yrityksesi.fi</div></div></footer>
<div class="callbar"><a class="btn">${svg('phone')}Soita</a><a class="btn btn--ghost">Tarjous</a></div>`;

  document.body.className = 'old';
  return `<div class="oldwrap"><div class="oldhead">JULKISIVU&nbsp;OY&nbsp;-&nbsp;Tervetuloa!</div><div class="oldnav"><a>Etusivu</a><a>Palvelut</a><a>Referenssit</a><a>Yhteystiedot</a></div><div class="oldbody"><div class="oldside"><b>VALIKKO</b><br><a>&raquo; Etusivu</a><br><a>&raquo; Palvelut</a><br><a>&raquo; Kuvagalleria</a><br><a>&raquo; Ota yhteyttä</a><br><br><b>Päivitetty:</b><br>2014<br><span class="oldcounter">Kävijöitä: 004213</span></div><div><h1 style="font:bold 22px Arial">Tervetuloa sivuillemme</h1><div class="oldimg">kuva puuttuu</div><p>Placeholder: vanha sivu. Korvaa oikealla kuvakaappauksella.</p><p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Teemme julkisivuremontteja pitkällä kokemuksella. Ota yhteyttä niin kerromme lisää.</p><p><a style="color:#00e">Klikkaa tästä yhteystietoihin</a></p><table border="1" cellpadding="6" style="border-collapse:collapse;font:12px Arial;margin-top:12px"><tr><td>Palvelu</td><td>Lisätietoa</td></tr><tr><td>Julkisivut</td><td>Kysy tarjous</td></tr><tr><td>Parvekkeet</td><td>Kysy tarjous</td></tr></table></div></div></div>`;
}

function wire() {
  // neutraali rautalanka viitekuville (esim. SVkatto, Holske)
  return `<header class="wrap nav"><div class="brand"><i>·</i><span>${P.get('name') || 'Yritys'}<small>KUVAKAAPPAUS TULOSSA</small></span></div><nav class="links"><span>▬▬</span><span>▬▬▬</span><span>▬▬</span></nav><a class="btn">▬▬▬▬</a></header><section class="hero"><div class="photo">${sc}</div><div class="hero__in"><h1 class="h1">${P.get('name') || 'Yritys'}</h1><p class="lead">Placeholder. Korvaa oikealla kuvakaappauksella.</p></div></section>`;
}

const view = P.get('view') || 'home';
document.getElementById('app').innerHTML = view === 'old' ? oldSite() : view === 'wire' ? wire() : site();
if (label) { const l = document.createElement('div'); l.className = 'label'; l.textContent = label; document.body.appendChild(l); }
if (P.get('focus') === 'call') document.body.classList.add('focus-call');
window.goTo = id => { const el = document.getElementById(id); if (el) window.scrollTo(0, el.getBoundingClientRect().top + scrollY - (innerWidth < 600 ? 12 : 24)); };
</script>
</body>
